<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>English Word Game for Kids</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
        body {
            font-family: 'Fredoka One', 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #f9d423 0%, #ff4e50 100%);
            text-align: center;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        h1 {
            color: #fff;
            margin-top: 30px;
            font-size: 2.7em;
            letter-spacing: 2px;
            text-shadow: 2px 4px 0 #ffb347, 0 0 10px #fff176;
            animation: bounce 1.2s infinite alternate;
        }
        @keyframes bounce {
            0% { transform: translateY(0);}
            100% { transform: translateY(-12px);}
        }
        #game-container {
            background: linear-gradient(135deg, #fffbe7 0%, #e0f7fa 100%);
            border-radius: 48px 32px 48px 32px;
            box-shadow: 0 12px 48px 0 rgba(0,0,0,0.22), 0 0 0 10px #ffb34733;
            display: inline-block;
            margin: 40px auto;
            padding: 48px 60px 36px 60px;
            position: relative;
            min-width: 380px;
            min-height: 520px;
            border: 8px double #ffb347;
            animation: popin 0.7s cubic-bezier(.68,-0.55,.27,1.55);
            z-index: 1;
        }
        @keyframes popin {
            0% { transform: scale(0.7);}
            100% { transform: scale(1);}
        }
        #image {
            width: 300px;
            height: 300px;
            object-fit: contain;
            margin-bottom: 20px;
            border-radius: 50%;
            background: radial-gradient(circle at 60% 40%, #fffbe7 60%, #ffe0f7 100%);
            border: 10px dashed #ff4e50;
            box-shadow: 0 8px 32px 0 rgba(255, 78, 80, 0.25), 0 0 0 12px #fff17655;
            transition: transform 0.4s cubic-bezier(.68,-0.55,.27,1.55), box-shadow 0.3s;
            animation: imagePop 1.2s cubic-bezier(.68,-0.55,.27,1.55);
            z-index: 2;
            position: relative;
        }
        @keyframes imagePop {
            0% { transform: scale(0.7);}
            60% { transform: scale(1.1);}
            100% { transform: scale(1);}
        }
        #image.animate {
            animation: wiggle 0.7s, imagePop 1.2s cubic-bezier(.68,-0.55,.27,1.55);
        }
        @keyframes wiggle {
            0% { transform: rotate(-8deg);}
            20% { transform: rotate(8deg);}
            40% { transform: rotate(-8deg);}
            60% { transform: rotate(8deg);}
            80% { transform: rotate(-8deg);}
            100% { transform: rotate(0);}
        }
        #word-choices {
            margin: 20px 0;
        }
        .choice-btn {
            background: linear-gradient(135deg, #ffb347 0%, #ff4e50 100%);
            border: 4px solid #fff176;
            color: #fff;
            font-size: 1.5em;
            font-family: 'Fredoka One', 'Comic Sans MS', cursive, sans-serif;
            border-radius: 24px 32px 24px 32px;
            padding: 18px 48px;
            margin: 18px 16px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 16px rgba(255, 190, 113, 0.22), 0 0 0 6px #fffbe7aa;
            outline: none;
            position: relative;
            animation: btnPop 0.7s cubic-bezier(.68,-0.55,.27,1.55);
        }
        @keyframes btnPop {
            0% { transform: scale(0.7);}
            60% { transform: scale(1.1);}
            100% { transform: scale(1);}
        }
        .choice-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #fff176 0%, #ffb347 100%);
            color: #ff4e50;
            transform: scale(1.13) rotate(-3deg);
            z-index: 2;
            box-shadow: 0 8px 32px 0 #ffb34755, 0 0 0 10px #fffbe7cc;
        }
        .choice-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            filter: grayscale(0.2) blur(0.5px);
        }
        .choice-btn.correct {
            background: linear-gradient(135deg, #7fff7f 0%, #2ecc40 100%);
            color: #fff;
            animation: correctPop 0.5s, rainbowGlow 1.2s infinite alternate;
            box-shadow: 0 0 24px 0 #7fff7faa, 0 0 0 10px #b2ff59aa;
        }
        .choice-btn.wrong {
            background: repeating-linear-gradient(135deg, #ff4e50 0%, #ffb347 100%, #ff4e50 200%);
            color: #fff;
            animation: shake 0.5s, wrongGlow 1.2s infinite alternate;
            box-shadow: 0 0 24px 0 #ff4e50aa, 0 0 0 10px #fff176aa;
        }
        @keyframes correctPop {
            0% { transform: scale(1);}
            60% { transform: scale(1.18);}
            100% { transform: scale(1);}
        }
        @keyframes shake {
            0% { transform: translateX(0);}
            20% { transform: translateX(-12px);}
            40% { transform: translateX(12px);}
            60% { transform: translateX(-12px);}
            80% { transform: translateX(12px);}
            100% { transform: translateX(0);}
        }
        @keyframes rainbowGlow {
            0% { box-shadow: 0 0 24px 0 #7fff7faa, 0 0 0 10px #b2ff59aa;}
            100% { box-shadow: 0 0 32px 0 #2ecc40aa, 0 0 0 16px #fff176aa;}
        }
        @keyframes wrongGlow {
            0% { box-shadow: 0 0 24px 0 #ff4e50aa, 0 0 0 10px #fff176aa;}
            100% { box-shadow: 0 0 32px 0 #ffb347aa, 0 0 0 16px #ff4e50aa;}
        }
        #result {
            font-size: 2em;
            margin: 32px 0 18px 0;
            min-height: 48px;
            font-family: 'Fredoka One', 'Comic Sans MS', cursive, sans-serif;
            color: #ff4e50;
            text-shadow: 2px 4px 0 #fff176, 0 0 10px #fffbe7;
            letter-spacing: 2px;
            min-height: 48px;
            transition: color 0.3s, text-shadow 0.3s;
            animation: resultPop 0.7s cubic-bezier(.68,-0.55,.27,1.55);
        }
        #result.correct {
            color: #2ecc40;
            text-shadow: 2px 4px 0 #b2ff59, 0 0 10px #fffbe7;
            animation: resultPop 0.7s, rainbowGlow 1.2s infinite alternate;
        }
        #result.wrong {
            color: #ff4e50;
            text-shadow: 2px 4px 0 #fff176, 0 0 10px #fffbe7;
            animation: shake 0.5s, wrongGlow 1.2s infinite alternate;
        }
        @keyframes resultPop {
            0% { transform: scale(1);}
            60% { transform: scale(1.18);}
            100% { transform: scale(1);}
        }
        #next-btn {
            background: linear-gradient(135deg, #7fff7f 0%, #2ecc40 100%);
            color: #fff;
            border: none;
            border-radius: 24px 32px 24px 32px;
            padding: 18px 48px;
            font-size: 1.3em;
            font-family: 'Fredoka One', 'Comic Sans MS', cursive, sans-serif;
            cursor: pointer;
            margin-top: 18px;
            display: none;
            box-shadow: 0 4px 16px rgba(46, 204, 64, 0.22), 0 0 0 6px #fffbe7aa;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            animation: btnPop 0.7s cubic-bezier(.68,-0.55,.27,1.55);
        }
        #next-btn:hover {
            background: linear-gradient(135deg, #2ecc40 0%, #7fff7f 100%);
            color: #fff;
            transform: scale(1.13) rotate(3deg);
            box-shadow: 0 8px 32px 0 #7fff7faa, 0 0 0 10px #fffbe7cc;
        }
        #score {
            font-size: 1.3em;
            color: #ffb347;
            margin-top: 24px;
            font-family: 'Fredoka One', 'Comic Sans MS', cursive, sans-serif;
            text-shadow: 2px 4px 0 #fff, 0 0 10px #fffbe7;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, #fffbe7 60%, #ffb347 100%);
            border-radius: 16px;
            padding: 8px 24px;
            display: inline-block;
            border: 2px solid #ffb347;
            box-shadow: 0 2px 8px #ffb34733;
            animation: scorePop 1.2s cubic-bezier(.68,-0.55,.27,1.55);
        }
        @keyframes scorePop {
            0% { transform: scale(0.7);}
            60% { transform: scale(1.1);}
            100% { transform: scale(1);}
        }
        .confetti {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            top: 0; left: 0; width: 100vw; height: 100vh;
        }
        /* Fun background shapes */
        .bg-shape {
            position: absolute;
            z-index: 0;
            opacity: 0.18;
            pointer-events: none;
        }
        .bg-star {
            width: 80px; height: 80px;
            background: url('https://cdn.pixabay.com/photo/2013/07/12/13/58/ball-147087_1280.png') no-repeat center/contain;
            left: 10px; top: 10px;
            animation: floatStar 6s infinite alternate;
            filter: hue-rotate(60deg) drop-shadow(0 0 12px #fffbe7);
        }
        .bg-ball {
            width: 120px; height: 120px;
            background: url('https://cdn.pixabay.com/photo/2013/07/12/13/58/ball-147087_1280.png') no-repeat center/contain;
            right: 20px; bottom: 30px;
            animation: floatBall 7s infinite alternate;
            filter: hue-rotate(180deg) drop-shadow(0 0 18px #ffb347);
        }
        .bg-cloud {
            width: 160px; height: 90px;
            background: url('https://cdn.pixabay.com/photo/2013/07/12/13/58/ball-147087_1280.png') no-repeat center/contain;
            left: 50%; top: 60px;
            transform: translateX(-50%);
            opacity: 0.12;
            animation: floatCloud 8s infinite alternate;
            filter: blur(2px) grayscale(0.5);
        }
        .bg-heart {
            width: 70px; height: 70px;
            background: url('https://cdn.pixabay.com/photo/2013/07/12/13/58/ball-147087_1280.png') no-repeat center/contain;
            left: 80px; bottom: 60px;
            opacity: 0.16;
            animation: floatHeart 5s infinite alternate;
            filter: hue-rotate(300deg) drop-shadow(0 0 10px #ff4e50);
        }
        @keyframes floatStar {
            0% { transform: translateY(0);}
            100% { transform: translateY(30px) rotate(10deg);}
        }
        @keyframes floatBall {
            0% { transform: translateY(0);}
            100% { transform: translateY(-30px) rotate(-10deg);}
        }
        @keyframes floatCloud {
            0% { transform: translateX(-50%) scale(1);}
            100% { transform: translateX(-50%) scale(1.08);}
        }
        @keyframes floatHeart {
            0% { transform: scale(1);}
            100% { transform: scale(1.15) rotate(-8deg);}
        }
    </style>
</head>
<body>
    <div class="bg-shape bg-star"></div>
    <div class="bg-shape bg-ball"></div>
    <div class="bg-shape bg-cloud"></div>
    <div class="bg-shape bg-heart"></div>
    <h1>
        <span style="display:inline-block;animation:bounce 1.2s infinite alternate;color:#fff176;">🦄</span>
        Learn New English Words!
        <span style="display:inline-block;animation:bounce 1.2s infinite alternate 0.6s;color:#7fff7f;">🌈</span>
    </h1>
    <div id="game-container">
        <img id="image" src="" alt="Guess the word!">
        <div id="word-choices"></div>
        <div id="result"></div>
        <button id="next-btn">Next</button>
        <div id="score"></div>
    </div>
    <canvas class="confetti"></canvas>
    <script>
        // You can add more words and images here!
        const words = [
            {
                word: "cat",
                img: "https://cdn.pixabay.com/photo/2017/11/09/21/41/cat-2934720_1280.jpg",
                choices: ["cat", "dog", "car", "apple"]
            },
            {
                word: "apple",
                img: "https://cdn.pixabay.com/photo/2014/02/01/17/28/apple-256261_1280.jpg",
                choices: ["banana", "apple", "ball", "fish"]
            },
            {
                word: "car",
                img: "https://cdn.pixabay.com/photo/2012/05/29/00/43/car-49278_1280.jpg",
                choices: ["car", "tree", "cat", "book"]
            },
            {
                word: "dog",
                img: "https://cdn.pixabay.com/photo/2016/02/19/10/00/dog-1207816_1280.jpg",
                choices: ["fish", "dog", "bird", "apple"]
            },
            {
                word: "ball",
                img: "https://cdn.pixabay.com/photo/2013/07/12/13/58/ball-147087_1280.png",
                choices: ["ball", "car", "cat", "tree"]
            },
            {
                word: "fish",
                img: "https://cdn.pixabay.com/photo/2016/03/05/19/02/fish-1232873_1280.jpg",
                choices: ["fish", "dog", "apple", "book"]
            }
        ];

        let current = 0;
        let score = 0;

        // Confetti effect for correct answer
        function confettiBurst() {
            const canvas = document.querySelector('.confetti');
            const ctx = canvas.getContext('2d');
            const W = window.innerWidth, H = window.innerHeight;
            canvas.width = W; canvas.height = H;
            let confs = [];
            for (let i = 0; i < 80; i++) {
                confs.push({
                    x: Math.random() * W,
                    y: Math.random() * H * 0.3,
                    r: 10 + Math.random() * 18,
                    d: Math.random() * 360,
                    color: `hsl(${Math.random()*360},90%,70%)`,
                    tilt: Math.random() * 30 - 15,
                    tiltAngle: 0,
                    tiltAngleInc: (Math.random() * 0.09) + 0.07,
                    shape: Math.random() > 0.7 ? "star" : (Math.random() > 0.5 ? "circle" : "rect")
                });
            }
            let frame = 0;
            function draw() {
                ctx.clearRect(0,0,W,H);
                for (let i = 0; i < confs.length; i++) {
                    let c = confs[i];
                    ctx.save();
                    ctx.translate(c.x + c.tilt, c.y);
                    ctx.rotate(c.tiltAngle);
                    ctx.globalAlpha = 0.85;
                    ctx.strokeStyle = c.color;
                    ctx.fillStyle = c.color;
                    if (c.shape === "star") {
                        drawStar(ctx, 0, 0, c.r/2, c.r, 5);
                    } else if (c.shape === "circle") {
                        ctx.beginPath();
                        ctx.arc(0, 0, c.r/2, 0, 2 * Math.PI);
                        ctx.fill();
                    } else {
                        ctx.beginPath();
                        ctx.rect(-c.r/2, -c.r/2, c.r, c.r);
                        ctx.fill();
                    }
                    ctx.restore();
                }
                update();
                frame++;
                if (frame < 70) requestAnimationFrame(draw);
                else ctx.clearRect(0,0,W,H);
            }
            function drawStar(ctx, x, y, r1, r2, n) {
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(x, y - r2);
                for (let i = 0; i < n * 2; i++) {
                    let angle = Math.PI / n * i;
                    let radius = i % 2 === 0 ? r2 : r1;
                    ctx.lineTo(x + Math.sin(angle) * radius, y - Math.cos(angle) * radius);
                }
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
            function update() {
                for (let i = 0; i < confs.length; i++) {
                    let c = confs[i];
                    c.y += 4 + Math.random()*2;
                    c.tiltAngle += c.tiltAngleInc;
                    c.tilt = Math.sin(c.tiltAngle) * 18;
                }
            }
            draw();
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function showWord() {
            document.getElementById('result').textContent = '';
            document.getElementById('result').className = '';
            document.getElementById('next-btn').style.display = 'none';
            const w = words[current];
            const img = document.getElementById('image');
            img.src = w.img;
            img.alt = "Guess: " + w.word;
            img.classList.remove('animate');
            setTimeout(() => img.classList.add('animate'), 80);

            let choices = [...w.choices];
            shuffle(choices);
            const choicesDiv = document.getElementById('word-choices');
            choicesDiv.innerHTML = '';
            let delay = 0;
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = choice;
                btn.style.opacity = 0;
                btn.style.transform = "scale(0.7)";
                btn.onclick = () => checkAnswer(choice, btn);
                choicesDiv.appendChild(btn);
                setTimeout(() => {
                    btn.style.opacity = 1;
                    btn.style.transform = "scale(1)";
                    btn.style.transition = "opacity 0.4s, transform 0.4s cubic-bezier(.68,-0.55,.27,1.55)";
                }, 120 + delay);
                delay += 120;
            });
            document.getElementById('score').textContent = `Score: ${score} / ${words.length}`;
        }

        function checkAnswer(choice, btn) {
            const w = words[current];
            const resultDiv = document.getElementById('result');
            let correctBtn;
            Array.from(document.getElementsByClassName('choice-btn')).forEach(b => {
                b.disabled = true;
                if (b.textContent === w.word) correctBtn = b;
            });
            if (choice === w.word) {
                resultDiv.textContent = "🎉 Correct! Good job!";
                resultDiv.className = "correct";
                btn.classList.add('correct');
                score++;
                confettiBurst();
                // Fun emoji burst
                emojiBurst(btn, ["🎉","🌈","🦄","⭐","🥳","😺","🍭","🍬"]);
            } else {
                resultDiv.textContent = `❌ Oops! The correct word is "${w.word}".`;
                resultDiv.className = "wrong";
                btn.classList.add('wrong');
                if (correctBtn) correctBtn.classList.add('correct');
                emojiBurst(btn, ["😿","💦","😅","😮","😳"]);
            }
            document.getElementById('next-btn').style.display = 'inline-block';
            document.getElementById('score').textContent = `Score: ${score} / ${words.length}`;
        }

        function emojiBurst(btn, emojis) {
            const rect = btn.getBoundingClientRect();
            const parentRect = document.body.getBoundingClientRect();
            for (let i = 0; i < 8; i++) {
                const emoji = document.createElement('span');
                emoji.textContent = emojis[Math.floor(Math.random()*emojis.length)];
                emoji.style.position = 'fixed';
                emoji.style.left = (rect.left + rect.width/2 - parentRect.left) + 'px';
                emoji.style.top = (rect.top + rect.height/2 - parentRect.top) + 'px';
                emoji.style.fontSize = (32 + Math.random()*24) + 'px';
                emoji.style.pointerEvents = 'none';
                emoji.style.zIndex = 9999;
                emoji.style.transition = 'transform 1.1s cubic-bezier(.68,-0.55,.27,1.55), opacity 1.1s';
                document.body.appendChild(emoji);
                setTimeout(() => {
                    emoji.style.transform = `translate(${(Math.random()-0.5)*220}px,${-80-Math.random()*120}px) rotate(${(Math.random()-0.5)*120}deg) scale(${0.7+Math.random()*1.2})`;
                    emoji.style.opacity = 0;
                }, 10);
                setTimeout(() => emoji.remove(), 1200);
            }
        }

        document.getElementById('next-btn').onclick = function() {
            current++;
            if (current < words.length) {
                showWord();
            } else {
                document.getElementById('game-container').innerHTML = `
                    <h2 style="color:#ff4e50; font-family:'Fredoka One',cursive; font-size:2.5em; text-shadow:2px 4px 0 #fff176,0 0 10px #fffbe7;animation:resultPop 0.7s;">🎊 Game Over! 🎊</h2>
                    <p style="font-size:1.5em; color:#2ecc40; text-shadow:2px 4px 0 #fff;animation:scorePop 1.2s;">Your final score is <b>${score}</b> out of <b>${words.length}</b>.</p>
                    <div style="font-size:2.2em;margin:18px 0;animation:btnPop 0.7s;">${score === words.length ? "🏆 Perfect! 🌈🦄" : (score > words.length/2 ? "👏 Great job! 🎉" : "👍 Keep practicing! 😺")}</div>
                    <button style="background:linear-gradient(135deg,#ffb347 0%,#ff4e50 100%);color:#fff;border:none;border-radius:24px 32px 24px 32px;padding:18px 48px;font-size:1.3em;font-family:'Fredoka One',cursive;cursor:pointer;box-shadow:0 4px 16px rgba(255,190,113,0.22),0 0 0 6px #fffbe7aa;transition:background 0.2s,transform 0.15s;" onclick="window.location.reload()">Play Again</button>
                `;
                confettiBurst();
            }
        };

        shuffle(words);
        showWord();

        // Responsive confetti canvas
        window.addEventListener('resize', () => {
            const canvas = document.querySelector('.confetti');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
