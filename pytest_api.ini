[tool:pytest]
# Pytest configuration for Aider REST API tests

# Test discovery
testpaths = .
python_files = test_*.py *_test.py test_api*.py
python_functions = test_*
python_classes = Test*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10
    --cov=api_server
    --cov=session_manager
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Tests that take a long time to run
    streaming: Tests for streaming functionality
    search_replace: Tests for search/replace functionality
    file_ops: Tests for file operations
    session: Tests for session management
    mock: Tests that use mocking
    api: API endpoint tests

# Test timeouts
timeout = 30
timeout_method = thread

# Asyncio settings
asyncio_mode = auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning 